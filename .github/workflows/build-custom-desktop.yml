name: Build custom desktop

# Builds this fork's macOS (Apple Silicon) DMG on demand and on pushes that touch the
# desktop app, the bundled server, or the packaging scripts. sync-upstream.yml dispatches
# this workflow explicitly after each upstream release merge, so `paths` only filters direct
# pushes; it does not gate dispatch. The bundle is built once, then packaged; the DMG,
# latest-mac.yml, and a published release for in-app updates are produced.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-custom-desktop.yml"
      - "apps/desktop/**"
      - "apps/server/**"
      - "packages/**"
      - "native/**"
      - "scripts/build-desktop-artifact.ts"
      - "package.json"
      - "pnpm-lock.yaml"
  workflow_dispatch:
    inputs:
      runner:
        description: "macOS runner label (e.g. macos-latest or macos-15)"
        type: string
        default: "macos-latest"

permissions:
  contents: write

# Serialize builds instead of replacing them. A hosted macOS runner often takes >10m to
# assign, and cancel-in-progress also cancelled runs that were still pending, leaving
# billable_ms at 0. The trade-off is that a stuck run cannot be displaced by a newer push;
# it holds the group until it finishes or hits the 90m timeout.
concurrency:
  group: custom-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos-arm64:
    name: macOS arm64 DMG
    # macos-14 is retired; macos-latest resolves to macos-26 (arm64, Xcode 26).
    # Pass runner=macos-15 on workflow_dispatch if macos-latest queues too long.
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.runner || 'macos-latest' }}
    timeout-minutes: 90
    steps:
      - name: Runner diagnostics
        run: |
          set -x
          date -u
          sw_vers || true
          xcodebuild -version || true

      # Exclude .repos/ whose orphaned gitlinks fail actions/checkout's submodule cleanup.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      # build-apple-speech.mjs compiles for macos26.0 and requires Xcode 26+.
      - name: Select Xcode 26
        run: |
          set -euo pipefail
          current_major="$(xcodebuild -version | sed -nE 's/^Xcode ([0-9]+).*/\1/p')"
          if [[ -n "$current_major" && "$current_major" -ge 26 ]]; then
            echo "Default Xcode is already $current_major."
            exit 0
          fi
          xcode_26="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1 || true)"
          if [[ -z "$xcode_26" ]]; then
            echo "::error::No Xcode 26+ installation found on this runner."
            exit 1
          fi
          echo "Selecting $xcode_26"
          sudo xcode-select -s "$xcode_26/Contents/Developer"
          xcodebuild -version

      # Installs Vite+ (vp) at the version package.json pins and the desktop
      # workspace dependencies from pnpm-lock.yaml.
      - name: Set up Vite+ and install dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...

      - name: Cache resource monitor
        id: resource_monitor_cache
        uses: actions/cache@v4
        with:
          path: native/resource-monitor/target/aarch64-apple-darwin/release/t3-resource-monitor
          key: resource-monitor-aarch64-apple-darwin-${{ hashFiles('.cargo/config.toml', 'native/resource-monitor/Cargo.lock', 'native/resource-monitor/Cargo.toml', 'native/resource-monitor/src/**') }}

      - name: Ensure Rust arm64 target
        if: steps.resource_monitor_cache.outputs.cache-hit != 'true'
        run: rustup target add aarch64-apple-darwin

      - name: Cache stable macOS self-signing identity
        uses: actions/cache@v4
        id: signing_identity_cache
        with:
          path: ${{ runner.temp }}/t3-signing
          key: t3-custom-mac-signing-v2

      # Follows upstream: apps/desktop/package.json holds the last synced release (0.1.12), and
      # each build appends -N so the app version stays monotonic for electron-updater.
      - name: Compute fork build version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base="$(node -p "require('./apps/desktop/package.json').version.split('-')[0]")"
          last=0
          while read -r tag; do
            if [[ "$tag" =~ ^v${base//./\\.}-([0-9]+)$ ]]; then
              n="${BASH_REMATCH[1]}"
              [ "$n" -gt "$last" ] && last="$n"
            fi
          done < <(gh release list --limit 100 --json tagName --jq '.[].tagName')
          version="${base}-$((last + 1))"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Fork build version: ${version}"

      - name: Build desktop bundle
        run: vp run build:desktop:bundle

      - name: Package macOS arm64 DMG
        env:
          # A cached self-signed identity keeps the designated requirement (and TCC grants) stable.
          T3CODE_MAC_SIGNING_DIR: ${{ runner.temp }}/t3-signing
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          T3CODE_DESKTOP_REUSE_RESOURCE_MONITOR: ${{ steps.resource_monitor_cache.outputs.cache-hit == 'true' }}
        run: vp run dist:desktop:artifact --platform mac --target dmg --arch arm64 --skip-build --build-version "${{ steps.version.outputs.version }}"

      - name: Stage updater manifests for release
        run: |
          set -euo pipefail
          shopt -s nullglob
          if [ ! -f release/latest-mac.yml ]; then
            for yml in release/**/latest-mac.yml release/**/latest-mac-*.yml; do
              [ -f "$yml" ] || continue
              cp "$yml" "release/$(basename "$yml")"
              break
            done
          fi
          if [ ! -f release/latest-mac.yml ]; then
            echo "::error::No latest-mac.yml produced by electron-builder."
            find release -maxdepth 4 -name '*.yml' -print
            exit 1
          fi

      # Keep Actions artifact storage tiny (Free plan 500 MB). Binaries live on the release only.
      - name: Write release checksum manifest
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p release/checksums
          {
            echo "version=${{ steps.version.outputs.version }}"
            echo "sha=${GITHUB_SHA}"
            echo "built_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > release/checksums/build-metadata.txt
          for f in release/*.dmg release/*.zip; do
            base="$(basename "$f")"
            shasum -a 256 "$f" | awk -v n="$base" '{print $1 "  " n}' >> release/checksums/SHASUMS256.txt
            ls -l "$f" >> release/checksums/artifact-sizes.txt
          done

      - name: Upload build metadata (artifact storage)
        uses: actions/upload-artifact@v4
        with:
          name: t3-code-custom-macos-arm64-metadata
          path: release/checksums/
          if-no-files-found: error
          retention-days: 3

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(release/*.dmg release/*.zip release/latest-mac.yml release/latest-mac-*.yml)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "::error::No desktop artifacts were produced."
            exit 1
          fi
          version="${VERSION}"
          tag="v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
          else
            gh release create "$tag" "${files[@]}" \
              --latest \
              --target "$GITHUB_SHA" \
              --title "T3 Code Custom ${version}" \
              --notes "Custom macOS arm64 build: telemetry removed, local proxy defaults, Iris badge-fix theme, com.qiuz.t3code bundle id, stable self-signed code signature, and latest-mac.yml for in-app updates."
          fi
